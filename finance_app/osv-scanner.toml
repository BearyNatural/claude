# OSV-Scanner exceptions for finance_app (Geranium). Keep each one narrow, explained and time-limited.

[[IgnoredVulns]]
id = "GHSA-4r6h-8v6p-xvw6"
# SheetJS prototype pollution, fixed in 0.19.3. Geranium installs xlsx 0.20.3 from
# https://cdn.sheetjs.com (see package.json), which includes the fix. The advisory lists
# every npm version as affected only because fixed releases are no longer published to npm.
ignoreUntil = 2027-06-30T00:00:00Z
reason = "False positive: installed xlsx is the fixed 0.20.3 build from cdn.sheetjs.com, not the unmaintained npm release."

[[IgnoredVulns]]
id = "GHSA-5pgg-2g8v-p4x9"
# SheetJS ReDoS, fixed in 0.20.2. Same situation as above: 0.20.3 from the SheetJS CDN is fixed.
ignoreUntil = 2027-06-30T00:00:00Z
reason = "False positive: installed xlsx is the fixed 0.20.3 build from cdn.sheetjs.com, not the unmaintained npm release."

[[IgnoredVulns]]
id = "GHSA-82fw-gwwq-j7x9"
# Dev-only (vitest / @vitest/mocker 3.2.7). The flaw needs an attacker to reach a Vite dev
# server WebSocket that registers redirect mocks (browser mode, --ui/--api, or third-party dev
# servers using mockerPlugin). Geranium only runs `vitest run` in the Node environment, starts
# no such server, and vitest is not in the packaged app. The fix (4.1.11) cannot be adopted yet:
# npm 10 (bundled with Node 22, used by CI and the weekly `npm update`) crashes with
# "Cannot read properties of null (reading 'edgesOut')" resolving vitest 4's optional peers.
# Re-check when CI moves to npm 11 or the npm bug is fixed, then upgrade vitest and remove this.
ignoreUntil = 2026-12-31T00:00:00Z
reason = "Dev-only test runner; vulnerable dev-server path not used. Upgrade blocked by an npm 10 crash; revisit by end of 2026."

[[IgnoredVulns]]
id = "GHSA-5gmw-xhrv-c9v3"
# Dev-only: tinypool 1.1.1 comes with vitest 3.2.7 (fixed in tinypool 2.1.1, used from vitest 4).
# A prototype-pollution "gadget": it only matters if something else in the same test process
# already lets an attacker pollute Object.prototype. It runs only our own tests (`vitest run`)
# and is not in the packaged app. Goes away with the vitest upgrade blocked above.
ignoreUntil = 2026-12-31T00:00:00Z
reason = "Dev-only test runner dependency; needs a separate prototype-pollution bug; removed with the vitest 4 upgrade."

[[IgnoredVulns]]
id = "GHSA-85c8-ppgw-ccpr"
# Same as above (tinypool run() options; fixed in 2.1.2).
ignoreUntil = 2026-12-31T00:00:00Z
reason = "Dev-only test runner dependency; needs a separate prototype-pollution bug; removed with the vitest 4 upgrade."

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
# Build-time only: sprintf-js 1.1.3 via electron-builder › @electron/get › global-agent › roarr
# (logging). A denial of service that needs attacker-controlled format strings; electron-builder
# only logs its own messages while downloading Electron. Not in the packaged app. No fixed
# sprintf-js release yet; re-check when electron-builder drops global-agent or a fix is published.
ignoreUntil = 2026-12-31T00:00:00Z
reason = "Build-time logging dependency of electron-builder; format strings are not attacker-controlled; no fix released."
