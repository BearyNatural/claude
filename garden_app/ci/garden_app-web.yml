# ── garden_app (Sow by Season) — publish the browser version ─────────────────
# Builds the web version of the app and publishes it to the /garden/ folder of
# BearyNatural/BearyNatural.github.io (daydreaminginthecloud.bearynatural.dev/garden/).
# Only that folder is replaced; the rest of the site is untouched except for a
# small script in its 404 page that sends /garden/... links back into the app.
#
# The browser build never contains private tokens — its files are public.
# It includes the latest plant list at build time, so plant data changes on
# main reach the browser version when this runs.
#
# Access: SITE_DEPLOY_KEY is a deploy key with write access to that site
# repository only.

name: "garden_app · publish browser version"

on:
  push:
    branches: [main]
    paths:
      - 'garden_app/**'
      - '.github/workflows/garden_app-web.yml'
      - '!garden_app/ci/garden_app-android.yml'
      - '!garden_app/ci/garden_app-plant-data.yml'
      - '!garden_app/ci/garden_app-token-check.yml'
      - '!garden_app/ci/garden_app-plant-suggestions.yml'
      - '!garden_app/scripts/check-plant-suggestions.ts'
      - '!garden_app/docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden_app-web
  cancel-in-progress: true

defaults:
  run:
    working-directory: garden_app

jobs:
  publish:
    name: garden_app · publish browser version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else bash scripts/ci-install.sh; fi
      - name: Tests & type-check
        run: |
          npm test
          npm run typecheck
      - name: Build the browser version
        # No EXPO_PUBLIC_PLANT_DATA_TOKEN here on purpose: web files are public.
        run: |
          npx expo export --platform web --output-dir dist
          node scripts/prepare-web.mjs dist /garden
      - name: Publish to daydreaminginthecloud.bearynatural.dev/garden/
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error title=garden_app web::SITE_DEPLOY_KEY secret is missing."; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o IdentitiesOnly=yes"
          SITE="$RUNNER_TEMP/site"
          git clone --depth 1 git@github.com:BearyNatural/BearyNatural.github.io.git "$SITE"
          rm -rf "$SITE/garden"
          mkdir -p "$SITE/garden"
          cp -R dist/. "$SITE/garden/"
          # Deep links: the site's 404 page must send /garden/... back into the app.
          if [ -f "$SITE/404.html" ] && ! grep -q "Sow by Season (/garden/)" "$SITE/404.html"; then
            node -e '
              const fs = require("fs"); const f = process.argv[1];
              const s = fs.readFileSync(f, "utf8");
              const tag = "<script>/* Sow by Season (/garden/): reopen links to pages inside the app. */(function(){var p=location.pathname;if(p.indexOf(\"/garden/\")===0&&p!==\"/garden/\")location.replace(\"/garden/?to=\"+encodeURIComponent(p+location.search));})();</script>";
              fs.writeFileSync(f, s.replace(/<head>/i, "<head>\n    " + tag));
            ' "$SITE/404.html"
          fi
          cd "$SITE"
          git add -A garden 404.html
          if git diff --cached --quiet; then echo "Browser version unchanged."; exit 0; fi
          VERSION=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/garden_app/app.json").expo.version')
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Sow by Season browser version ${VERSION}"
          git push origin HEAD:main
          echo "Published Sow by Season ${VERSION} to /garden/."
      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/site_key
