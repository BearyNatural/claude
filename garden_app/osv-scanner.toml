# signing, which this app doesn't use; not in the app itself. No fixed
# node-forge release exists yet (1.4.0 is the latest).
ignoreUntil = 2026-11-30T00:00:00Z
reason = "Expo CLI code-signing helper, unused by this app and not shipped; no patched node-forge release exists yet."
