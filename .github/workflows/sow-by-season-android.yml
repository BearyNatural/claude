# Builds the Sow by Season Android app and publishes an installable .apk
# on the repository's Releases page.
#
# Runs when app code in garden_app/ changes on main, or manually from the
# Actions tab ("Run workflow").
#
# Signing: add these repository secrets (Settings → Secrets and variables →
# Actions) so every build is signed with the same key — required for updates
# to install over the top of the previous version without losing garden data:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the build still works but is signed with a throwaway debug key.

name: Sow by Season – Android app

on:
  push:
    branches: [main]
    paths:
      - 'garden_app/**'
      - '.github/workflows/sow-by-season-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sow-by-season-android
  cancel-in-progress: true

defaults:
  run:
    working-directory: garden_app

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (Expo picks compatible versions)
        run: bash scripts/ci-install.sh
      - name: Unit tests (gardening engine, storage, backup)
        run: npm test
      - name: Type-check engine
        run: npm run typecheck:domain
      - name: Type-check whole app
        run: npm run typecheck
        continue-on-error: true   # report only, until first device run is confirmed

  android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bash scripts/ci-install.sh

      - name: Set version code from build number
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            a.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
            console.log("version", a.expo.version, "code", a.expo.android.versionCode);
          '

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1

      - name: Build release APK
        working-directory: garden_app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p 'require("./app.json").expo.version')
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release.apk
          OUT="$GITHUB_WORKSPACE/SowBySeason-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$IN" aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks release.keystore \
              --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
              --out "$OUT" aligned.apk
            rm -f release.keystore
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set — APK is signed with a debug key. Updates may need an uninstall first (which deletes local garden data). Add the ANDROID_KEYSTORE_* secrets."
            cp aligned.apk "$OUT"
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: SowBySeason-android
          path: ${{ env.APK }}

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sow-by-season-v${{ env.VERSION }}-build${{ github.run_number }}
          name: Sow by Season ${{ env.VERSION }} (build ${{ github.run_number }})
          make_latest: true
          files: ${{ env.APK }}
          body: |
            ## Install on an Android phone
            1. On your phone, open this page and tap **SowBySeason-${{ env.VERSION }}-build${{ github.run_number }}.apk** to download it.
            2. Open the downloaded file (from the notification or the Files / Downloads app).
            3. If asked, allow your browser or Files app to **install unknown apps**, then tap **Install**.
            4. To update later, download the newest release and install it over the top — your garden data is kept.

            Signing: `${{ env.SIGNING }}` · Commit: ${{ github.sha }}
