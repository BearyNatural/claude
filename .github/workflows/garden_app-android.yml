# ── garden_app (Sow by Season) — Android build & release ─────────────────────
# Project-scoped: only runs for changes inside garden_app/, and only ever
# builds, tags and releases garden_app. Tags/releases are prefixed
# "garden_app-v" so they never mix with other projects in this repository.
#
# Triggers: push to main touching garden_app/, manual run, or the weekly
# maintenance workflow after it updates garden_app's dependencies.
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a temporary key (installable, but a later
# build signed differently can't update it without uninstalling first).
# Optional: PLANT_DATA_READ_TOKEN — fine-grained GitHub token, read-only access
# to BearyNatural/sow-by-season-plant-data, for plant list updates in the app.

name: "garden_app · Android build & release"

on:
  push:
    branches: [main]
    paths:
      - 'garden_app/**'
      - '.github/workflows/garden_app-android.yml'
      # Workflows that don't change the app itself.
      - '!garden_app/ci/garden_app-plant-data.yml'
      - '!garden_app/ci/garden_app-token-check.yml'
      - '!garden_app/ci/garden_app-plant-suggestions.yml'
      - '!garden_app/scripts/check-plant-suggestions.ts'
      - '!garden_app/ci/garden_app-web.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: Why is this build running?
        required: false
        default: manual

permissions:
  contents: write

concurrency:
  group: garden_app-android
  cancel-in-progress: true

env:
  PROJECT_DIR: garden_app

defaults:
  run:
    working-directory: garden_app

jobs:
  test:
    name: garden_app · tests & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else bash scripts/ci-install.sh; fi
      - name: Unit tests
        run: npm test
      - name: Type-check (gardening engine)
        run: npm run typecheck:domain
      - name: Type-check (whole app)
        run: npm run typecheck

  android:
    name: garden_app · build Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else bash scripts/ci-install.sh; fi

      - name: Set version code from build number
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            a.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
            console.log("version", a.expo.version, "code", a.expo.android.versionCode);
          '

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1

      - name: Check plant list access
        env:
          TOKEN: ${{ secrets.PLANT_DATA_READ_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning title=garden_app plant list::No PLANT_DATA_READ_TOKEN secret — this build won't receive plant list updates."; exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/BearyNatural/sow-by-season-plant-data/contents/catalogue.json)
          if [ "$CODE" = "200" ]; then echo "Plant list token works."
          else echo "::warning title=garden_app plant list::PLANT_DATA_READ_TOKEN can't read the plant list (HTTP $CODE) — it may have expired. Create a new read-only token and replace the secret."; fi

      # Real phones only (arm64 + armv7) — much faster. Passed as a -P flag rather
      # than appended to gradle.properties: prebuild writes that file without a
      # trailing newline, so appending corrupts its last property.
      - name: Build release APK
        working-directory: garden_app/android
        env:
          # Read-only token for the private plant list repository (see
          # src/services/catalogue/catalogueUpdates.ts). Optional: without it the
          # app skips plant list updates and uses its built-in list.
          EXPO_PUBLIC_PLANT_DATA_TOKEN: ${{ secrets.PLANT_DATA_READ_TOKEN }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./app.json").expo.version')
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          OUT="$GITHUB_WORKSPACE/SowBySeason-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          # Align first, then sign (signing after aligning keeps the signature valid).
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > sign.keystore
            SIGNING=release
          else
            echo "::warning title=garden_app signing::No ANDROID_KEYSTORE_* secrets — signing with a temporary key. Add the secrets so updates install over the top without losing garden data."
            KS_PASS=temporary; KEY_PASS=temporary; KEY_ALIAS=temporary
            keytool -genkeypair -keystore sign.keystore -storetype PKCS12 -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Sow by Season (temporary), O=BearyNatural, C=AU"
            SIGNING=temporary
          fi
          "$BT/apksigner" sign --ks sign.keystore --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out "$OUT" aligned.apk
          rm -f sign.keystore
          "$BT/apksigner" verify --verbose "$OUT"
          {
            echo "APK=$OUT"
            echo "APK_NAME=$(basename "$OUT")"
            echo "VERSION=$VERSION"
            echo "SIGNING=$SIGNING"
          } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: garden_app-android-apk
          path: ${{ env.APK }}

      - name: Publish garden_app release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: garden_app-v${{ env.VERSION }}-build${{ github.run_number }}
          name: "Sow by Season ${{ env.VERSION }} (build ${{ github.run_number }})"
          make_latest: true
          files: ${{ env.APK }}
          body: |
            **Project:** `garden_app` — Sow by Season (Android)

            ## Install on an Android phone
            1. On your phone, tap **${{ env.APK_NAME }}** below to download it.
            2. Open the downloaded file (from the notification or the Files / Downloads app).
            3. If asked, allow your browser or Files app to **install unknown apps**, then tap **Install**.
            4. To update later, install the newest release over the top — your garden data is kept.

            Trigger: ${{ github.event_name }} ${{ github.event.inputs.reason }} · Signing: `${{ env.SIGNING }}` · Commit: ${{ github.sha }}

      # Tells installed apps a new version exists (read with their read-only
      # plant list token). Written to the private plant data repository.
      - name: Announce the new version to installed apps
        env:
          DEPLOY_KEY: ${{ secrets.PLANT_DATA_DEPLOY_KEY }}
          TAG: garden_app-v${{ env.VERSION }}-build${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then echo "::warning title=garden_app update notice::PLANT_DATA_DEPLOY_KEY missing — installed apps won't be told about this version."; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/plant_data_key
          chmod 600 ~/.ssh/plant_data_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/plant_data_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:BearyNatural/sow-by-season-plant-data.git "$RUNNER_TEMP/plant-data"
          cd "$RUNNER_TEMP/plant-data"
          node -e '
            const fs = require("fs");
            fs.writeFileSync("app-version.json", JSON.stringify({
              version: process.env.VERSION,
              build: Number(process.env.GITHUB_RUN_NUMBER),
              url: `https://github.com/BearyNatural/claude/releases/tag/${process.env.TAG}`,
              publishedAt: new Date().toISOString(),
            }, null, 2) + "\n");
          '
          git add app-version.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "App version ${VERSION} (build ${GITHUB_RUN_NUMBER})"
          git push -q origin HEAD:main
          rm -f ~/.ssh/plant_data_key
          echo "Installed apps will be told about ${VERSION}."
