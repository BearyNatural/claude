# ── garden_app (Sow by Season) — publish the browser version ─────────────────
# Builds the web version of the app and publishes it to the /sow-by-season/
# folder of BearyNatural/BearyNatural.github.io
# (daydreaminginthecloud.bearynatural.dev/sow-by-season/). Only that folder is
# replaced; the rest of the site is untouched except for:
#   - a small script in its 404 page that sends /sow-by-season/... links back
#     into the app (static hosting has no per-page files),
#   - /garden/, the first address used, which now just redirects,
#   - .nojekyll, so folders starting with "_" (the app's _expo files) are served.
#
# The browser build never contains private tokens — its files are public.
# It includes the latest plant list at build time, so plant data changes on
# main reach the browser version when this runs.
#
# Access: SITE_DEPLOY_KEY is a deploy key with write access to that site
# repository only.

name: "garden_app · publish browser version"

on:
  push:
    branches: [main]
    paths:
      - 'garden_app/**'
      - '.github/workflows/garden_app-web.yml'
      - '!garden_app/ci/garden_app-android.yml'
      - '!garden_app/ci/garden_app-plant-data.yml'
      - '!garden_app/ci/garden_app-token-check.yml'
      - '!garden_app/ci/garden_app-plant-suggestions.yml'
      - '!garden_app/scripts/check-plant-suggestions.ts'
      - '!garden_app/docs/**'
      - '!garden_app/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden_app-web
  cancel-in-progress: true

defaults:
  run:
    working-directory: garden_app

jobs:
  publish:
    name: garden_app · publish browser version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else bash scripts/ci-install.sh; fi
      - name: Tests & type-check
        run: |
          npm test
          npm run typecheck
      - name: Build the browser version
        # No EXPO_PUBLIC_PLANT_DATA_TOKEN here on purpose: web files are public.
        run: |
          npx expo export --platform web --output-dir dist
          node scripts/prepare-web.mjs dist /sow-by-season
      - name: Publish to daydreaminginthecloud.bearynatural.dev/sow-by-season/
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error title=garden_app web::SITE_DEPLOY_KEY secret is missing."; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o IdentitiesOnly=yes"
          SITE="$RUNNER_TEMP/site"
          git clone --depth 1 git@github.com:BearyNatural/BearyNatural.github.io.git "$SITE"
          rm -rf "$SITE/sow-by-season"
          mkdir -p "$SITE/sow-by-season"
          cp -R dist/. "$SITE/sow-by-season/"
          # The first address (/garden/) now only redirects to the new one.
          rm -rf "$SITE/garden"
          mkdir -p "$SITE/garden"
          printf '%s\n' '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sow by Season has moved</title><meta http-equiv="refresh" content="0; url=/sow-by-season/"><link rel="canonical" href="/sow-by-season/"></head><body><p>Sow by Season has moved to <a href="/sow-by-season/">/sow-by-season/</a>.</p></body></html>' > "$SITE/garden/index.html"
          # 404 page: replace any earlier Sow by Season script with the current one.
          if [ -f "$SITE/404.html" ]; then
            node -e '
              const fs = require("fs"); const f = process.argv[1];
              let s = fs.readFileSync(f, "utf8");
              s = s.replace(/\s*<script>(?:(?!<\/script>)[\s\S])*?Sow by Season \([\s\S]*?<\/script>/g, "");
              const tag = "<script>/* Sow by Season (/sow-by-season/): reopen links to pages inside the app. */(function(){var p=location.pathname,b=\"/sow-by-season/\";if(p.indexOf(\"/garden/\")===0)p=b+p.slice(8);if(p.indexOf(b)===0&&p!==b)location.replace(b+\"?to=\"+encodeURIComponent(p+location.search));})();</script>";
              fs.writeFileSync(f, s.replace(/<head>/i, "<head>\n    " + tag));
            ' "$SITE/404.html"
          fi
          # GitHub Pages' Jekyll step skips folders starting with "_" (like sow-by-season/_expo); serve files as-is.
          touch "$SITE/.nojekyll"
          cd "$SITE"
          git add -A sow-by-season garden 404.html .nojekyll
          if git diff --cached --quiet; then echo "Browser version unchanged."; exit 0; fi
          VERSION=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/garden_app/app.json").expo.version')
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Sow by Season browser version ${VERSION}"
          git push origin HEAD:main
          echo "Published Sow by Season ${VERSION} to /sow-by-season/."
      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/site_key
